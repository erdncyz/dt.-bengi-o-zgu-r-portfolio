<!DOCTYPE html>
<html lang="tr" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050506" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="Dt. Bengi Özgür — Malatya'da diş hekimi, sporcu ve Tip 1 diyabet savunucusu. Klinik hassasiyet, saha mücadelesi, irade." />
  <title>Dt. Bengi Özgür | Diş Hekimi &amp; Sporcu</title>
  <link rel="preload" as="image" href="/dentist-bengi.jpg" fetchpriority="high" />
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var dark = stored !== 'light';
        document.documentElement.classList.toggle('dark', dark);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#050506' : '#F4F6F8');
      } catch (e) {}
    })();
  </script>
  <style>
    html, body { margin: 0; background: #050506; color: #EDEDEF; }
    html:not(.dark), html:not(.dark) body { background: #F4F6F8; color: #1C1917; }
  </style>
</head>

<body class="bg-background text-primary antialiased selection:bg-sugar selection:text-white">
  <a class="skip-link" href="#main">İçeriğe geç</a>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>
  <div id="root">
    <div class="boot">Dt. Bengi Özgür</div>
  </div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
